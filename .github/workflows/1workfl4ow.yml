name: Release

# Builds the platforms that cannot be built locally and attaches them to a
# DRAFT release. A draft is visible only to people with write access to the
# repository, so nothing here is public until you publish it — and you never
# publish it: you download the assets, delete the draft, and upload them to
# zsync.eu yourself. Nothing is written to an Actions artifact, because those
# ARE downloadable by anyone on a public repository.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes shown in the app's update prompt"
        required: false
        default: ""
      linux:
        description: "Also build Linux (normally built locally)"
        type: boolean
        default: false
      publish:
        description: "Publish the release instead of leaving it a draft (this makes it public)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Create the draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Create it if it does not exist yet
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; the builds will add to it"
            exit 0
          fi

          notes=$(printf '%s\n\n%s\n' \
            "${{ inputs.notes }}" \
            "Built by CI. Download these files, delete this release, then upload them to zsync.eu/zyntaxai/releases/ — see zyntaxai/PUBLISHING.md.")

          # Always born as a draft, so an unfinished release is never public.
          # The publish job flips it at the end if that was asked for.
          gh release create "$tag" \
            --title "ZyntaxAI $version" \
            --notes "$notes" \
            --draft

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:

        include: ${{ fromJSON(inputs.linux && '[{"os":"windows-latest","target":"windows-x86_64"},{"os":"macos-latest","target":"darwin-aarch64"},{"os":"macos-latest","target":"darwin-x86_64","triple":"x86_64-apple-darwin"},{"os":"ubuntu-22.04","target":"linux-x86_64"}]' || '[{"os":"windows-latest","target":"windows-x86_64"},{"os":"macos-latest","target":"darwin-aarch64"},{"os":"macos-latest","target":"darwin-x86_64","triple":"x86_64-apple-darwin"}]') }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Add the Rust target for a cross build
        if: matrix.triple != ''
        run: rustup target add ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux build dependencies
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${{ matrix.triple }}" ]; then
            pnpm release --target "${{ matrix.triple }}" --notes "${{ inputs.notes }}"
          else
            pnpm release --notes "${{ inputs.notes }}"
          fi

      - name: Name the manifest after its platform
        shell: bash
        run: mv dist/release/latest.json dist/release/latest-${{ matrix.target }}.json

      - name: Attach it to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          mkdir -p out
          find dist/release -type f -exec cp -n {} out/ \;
          ls -la out

          if [ -z "$(ls -A out)" ]; then
            echo "the build produced no artifacts"
            exit 1
          fi

          gh release upload "$TAG" out/* --clobber

  publish:
    name: Publish
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

  next-steps:
    name: What to do next
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat <<EOF
          The draft release ${{ needs.prepare.outputs.tag }} now holds every asset.
          It is visible only to people with write access to this repository.

          Download every asset from it, delete the release, then on your own machine:

            node scripts/site-sync.mjs ~/Downloads

          That copies the installers into zyntaxai/releases/<version>/, merges
          each latest-*.json into zyntaxai/latest.json alongside the Linux entry
          you built locally, and regenerates SHA256SUMS. Then upload the
          zyntaxai/ folder — files first, latest.json last.
          EOF
